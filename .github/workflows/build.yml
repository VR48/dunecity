name: Build Dune Legacy

on:
  push:
    branches: [ main, release-* ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: on v* tag builds, verify that the source-controlled version metadata
  # (CMakeLists.txt, include/config.h, vcpkg.json) already matches the tag.
  # This catches missing bump commits BEFORE any build/release/upload runs.
  verify-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Verify source version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"
          bash scripts/bump-version.sh --check
          SOURCE_VERSION=$(sed -n 's/^project(DuneCity VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          if [ "$SOURCE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: tag is v${TAG_VERSION} but source metadata says ${SOURCE_VERSION}."
            echo "::error::Commit the version bump with 'scripts/bump-version.sh ${TAG_VERSION}' before tagging."
            exit 1
          fi
          echo "OK — all source files agree on $SOURCE_VERSION, matches tag v${TAG_VERSION}"

  test-linux:
    runs-on: ubuntu-latest
    needs: [verify-version]
    if: always() && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libcurl4-openssl-dev \
            catch2

      - name: Configure CMake
        run: cmake -B build -DDUNECITY_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build tests
        run: cmake --build build --target dunelegacy_tests

      - name: Run tests
        run: |
          DUNE_CITY_SOURCE_DIR=${{ github.workspace }} \
          DUNECITY_DATADIR=${{ github.workspace }}/data \
          ./build/bin/dunelegacy_tests

  build-windows:
    runs-on: windows-latest
    # Wait for version check on tag builds; run unconditionally otherwise
    needs: [verify-version]
    if: always() && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake
        # Quote the -D arg so PowerShell expands $env:VCPKG_ROOT instead
        # of treating the colon-slash as a literal string. Without the
        # quotes CMake gets the unexpanded path and fails to find the
        # toolchain file.
        run: cmake -B build "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Create Installer Package
        run: |
          cd build
          cmake --install . --prefix install --config Release
          cpack -G ZIP -C Release

      - name: Upload Installer
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-Windows-Installer
          path: build/*.zip

  build-macos:
    # Runs on the Mac mini (claw.local, M4, macOS 26.6) registered as the
    # self-hosted runner `dunecity-mac-mini`. The `dunecity-builder` label is
    # what pins it there: the MacBook Air is still registered as a runner but
    # deliberately carries only the read-only self-hosted/macOS/ARM64 labels,
    # so it can never pick up a release build. Re-arm it as a fallback with:
    #   gh api -X POST repos/VR48/dunecity/actions/runners/25/labels \
    #     -f 'labels[]=dunecity-builder'
    # Pull requests never run here because this is a persistent machine with
    # repository access and a warm dependency cache.
    runs-on: [self-hosted, macOS, ARM64, dunecity-builder]
    needs: [verify-version]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      vars.ENABLE_MACOS_BUILD == 'true' &&
      (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # The mini has 10 cores / 16 GB. 8 parallel C++ TUs stays inside RAM.
      CMAKE_BUILD_PARALLEL_LEVEL: "8"
      # A `brew update` on every build is minutes of network time and the most
      # common cause of a slow or flaky macOS job.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      # Fail fast and legibly if this landed on a machine that is not set up,
      # rather than 10 minutes later inside vcpkg. Records which Mac built the
      # release, which matters when more than one runner carries the label.
      - name: Preflight — identify runner and verify toolchain
        run: |
          set -euo pipefail
          echo "Host:      $(hostname) ($(sysctl -n hw.model), $(sysctl -n hw.ncpu) cores)"
          echo "macOS:     $(sw_vers -productVersion)  Xcode CLT: $(xcode-select -p)"
          echo "Free disk: $(df -h / | awk 'NR==2 {print $4}')"

          if ! command -v brew >/dev/null 2>&1; then
            echo "::error title=Runner not provisioned::Homebrew is not on PATH. The runner reads its PATH from ~/actions-runner-dunecity/.path — it must include /opt/homebrew/bin."
            exit 1
          fi

          MISSING=()
          for tool in cmake ninja nasm autoconf automake glibtool pkg-config; do
            command -v "$tool" >/dev/null 2>&1 || MISSING+=("$tool")
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::notice title=Installing missing build deps::${MISSING[*]}"
          fi
          echo "cmake $(cmake --version | head -1) | ninja $(ninja --version) | nasm $(nasm --version | awk '{print $3}')"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Clean previous build
        run: rm -rf build

      # vcpkg builds SDL2 + its audio codecs, curl, miniupnpc and discord-rpc
      # from source; the autotools toolchain + nasm have to be present. Only
      # install what is actually missing — an unconditional `brew install` of
      # eight already-present formulas is pure network latency on a persistent
      # runner, and it is the step this job died in on the old laptop runner.
      - name: Install build deps
        run: |
          set -euo pipefail
          WANT=(autoconf autoconf-archive automake cmake libtool pkg-config nasm ninja)
          INSTALLED=$(brew list --formula -1)
          MISSING=()
          for f in "${WANT[@]}"; do
            grep -qx "$f" <<<"$INSTALLED" || MISSING+=("$f")
          done
          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "All build deps already present."
          else
            echo "Installing: ${MISSING[*]}"
            brew install "${MISSING[@]}"
          fi

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      # Use the machine-local vcpkg binary cache (seeded from the old runner)
      # so deps restore instead of rebuilding from source.
      - name: Fix vcpkg binary caching
        run: |
          mkdir -p "$HOME/.cache/vcpkg/archives"
          echo "VCPKG_BINARY_SOURCES=clear;files,$HOME/.cache/vcpkg/archives,readwrite" >> "$GITHUB_ENV"
          echo "Cache holds $(find "$HOME/.cache/vcpkg/archives" -name '*.zip' | wc -l | tr -d ' ') prebuilt packages."

      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=arm64-osx

      - name: Build
        run: cmake --build build --config Release --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"

      - name: Create DMG Installer
        run: |
          cd build
          cpack -G DragNDrop -C Release

      - name: Verify DMG
        run: bash scripts/verify-macos-dmg.sh build/DuneCity-*-macOS.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-macOS-DMG
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 14

      # A persistent runner keeps every past checkout's build tree. Drop the
      # Release objects once the DMG is safely uploaded; the vcpkg binary cache
      # (the expensive part) is outside _work and is untouched.
      - name: Reclaim build space
        if: always()
        run: rm -rf build/CMakeFiles build/vcpkg_installed || true

      - name: Notify Discord
        if: always() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK }}
        run: |
          VERSION=$(sed -n 's/^project(DuneCity VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ **macOS build passed** — DuneCity v${VERSION} DMG ready (built on $(hostname -s))"
          else
            MSG="❌ **macOS build failed** — DuneCity v${VERSION} (on $(hostname -s))"
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"${MSG}\"}" \
            "$DISCORD_WEBHOOK"

  build-linux:
    # Keep the release ABI on an older, stable glibc baseline. A moving
    # ubuntu-latest runner produced binaries requiring GLIBC_2.38.
    runs-on: ubuntu-22.04
    needs: [verify-version]
    if: always() && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-${{ hashFiles('vcpkg.json') }}

      # vcpkg builds several autotools-based ports from source on Linux
      # (libxcrypt, sdl2-mixer's flac/opus/etc.) and needs the GNU build
      # toolchain pre-installed on the runner. Without these the Configure
      # step fails with: "libxcrypt currently requires ... autoconf
      # autoconf-archive automake libtoolize". Also pulling in
      # build-essential + libltdl-dev so any other transitive port that
      # needs them is happy.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake libtool libltdl-dev \
            build-essential pkg-config bison flex \
            libsystemd-dev xvfb xauth

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-linux-x64-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      # run-vcpkg sets VCPKG_BINARY_SOURCES to 'clear;x-gha,readwrite' but
      # the x-gha backend was removed from vcpkg. The 'clear' prefix also
      # disables the default file-based cache. Override to use files-based
      # caching backed by the actions/cache step above.
      - name: Fix vcpkg binary caching
        run: echo "VCPKG_BINARY_SOURCES=clear;files,$HOME/.cache/vcpkg/archives,readwrite" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # Limit to 2 parallel jobs — ubuntu-latest has 4 cores but only 7GB
        # RAM, and 4 concurrent g++ -O2 processes on large TUs exceed that.
        run: cmake --build build --config Release --parallel 2

      - name: Create Linux Packages
        run: |
          cd build
          cmake --install . --prefix install --config Release
          cpack -G "DEB;RPM;TGZ" -C Release

      - name: Create AppImage
        run: |
          # Download linuxdeploy (fuse-less FUSE_APPIMAGE_EXTRACT_AND_RUN avoids
          # "fuse: device not found" errors on GitHub-hosted runners)
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # Stage the AppDir from the cmake install tree
          cd build
          cmake --install . --prefix AppDir/usr --config Release

          # Ensure icons and desktop file are in the right AppDir locations
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/128x128/apps
          cp ../dunecity.desktop AppDir/usr/share/applications/
          cp ../dunecity-128x128.png AppDir/usr/share/icons/hicolor/128x128/apps/dunecity.png

          # linuxdeploy bundles the binary's shared-library dependencies into the
          # AppDir, generates AppRun, and creates the final .AppImage
          ARCH=x86_64 FUSE_APPIMAGE_EXTRACT_AND_RUN=1 \
            ../linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/dunecity \
            --desktop-file AppDir/usr/share/applications/dunecity.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/128x128/apps/dunecity.png \
            --output appimage

          # Rename with version for clarity
          VERSION=$(sed -n 's/^project(DuneCity VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' ../CMakeLists.txt)
          mv DuneCity-*.AppImage "DuneCity-${VERSION}-Linux-x86_64.AppImage" 2>/dev/null || true

      - name: Smoke-test portable Linux packages
        run: |
          set -euo pipefail

          VERSION=$(sed -n 's/^project(DuneCity VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          SMOKE_ROOT="$RUNNER_TEMP/dunecity-linux-smoke"
          rm -rf "$SMOKE_ROOT"
          mkdir -p "$SMOKE_ROOT/tgz" "$SMOKE_ROOT/home"

          tar -xzf "build/DuneCity-${VERSION}-Linux-x64.tar.gz" -C "$SMOKE_ROOT/tgz"
          TGZ_BIN=$(find "$SMOKE_ROOT/tgz" -type f -path '*/bin/dunecity' -print -quit)
          TGZ_DATA=$(find "$SMOKE_ROOT/tgz" -type f -name 'DUNE.PAK' -print)
          APPIMAGE="build/DuneCity-${VERSION}-Linux-x86_64.AppImage"

          echo "TGZ executable: ${TGZ_BIN:-missing}"
          echo "TGZ DUNE.PAK: ${TGZ_DATA:-missing}"
          data_notice=${TGZ_DATA//'%'/'%25'}
          data_notice=${data_notice//$'\r'/'%0D'}
          data_notice=${data_notice//$'\n'/'%0A'}
          echo "::notice title=TGZ data layout::${data_notice:-DUNE.PAK was not packaged}"

          if [ -z "$TGZ_BIN" ] || [ ! -x "$TGZ_BIN" ]; then
            echo "::error title=TGZ smoke setup failed::Packaged dunecity executable was not found or is not executable."
            find "$SMOKE_ROOT/tgz" -maxdepth 4 -type f -print
            exit 1
          fi
          if [ ! -x "$APPIMAGE" ]; then
            echo "::error title=AppImage smoke setup failed::Expected AppImage is missing or not executable: $APPIMAGE"
            find build -maxdepth 1 -type f -print
            exit 1
          fi

          smoke_launch() {
            local label="$1"
            shift
            local executable="$1"
            shift
            local launch_dir
            launch_dir=$(cd "$(dirname "$executable")" && pwd)
            executable="$launch_dir/$(basename "$executable")"
            set +e
            (
              cd "$launch_dir"
              HOME="$SMOKE_ROOT/home" SDL_AUDIODRIVER=dummy SDL_RENDER_DRIVER=software \
                timeout 12s xvfb-run -a "$executable" "$@" --showlog
            ) >"$SMOKE_ROOT/${label}.log" 2>&1
            local status=$?
            set -e

            if [ "$status" -ne 124 ]; then
              echo "${label} exited during startup (status ${status})"
              cat "$SMOKE_ROOT/${label}.log"
              find "$SMOKE_ROOT/home" -type f -name '*.log' -exec sh -c \
                'echo "--- $1"; cat "$1"' _ {} \;
              local details
              details=$(sed -n '1,80p' "$SMOKE_ROOT/${label}.log")
              details=${details//'%'/'%25'}
              details=${details//$'\r'/'%0D'}
              details=${details//$'\n'/'%0A'}
              echo "::error title=${label} portable startup failed (status ${status})::${details:-No process output was captured.}"
              return 1
            fi
          }

          smoke_status=0
          smoke_launch tgz "$TGZ_BIN" || smoke_status=1
          APPIMAGE_EXTRACT_AND_RUN=1 smoke_launch appimage "$APPIMAGE" || smoke_status=1
          exit "$smoke_status"

      - name: Upload Packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-Linux-Packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.AppImage

  # Rolling dev build: update a "latest-dev" pre-release on every main push
  # so builds are always downloadable from the releases page.
  dev-release:
    needs: [build-windows, build-linux, build-macos]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.build-windows.result == 'success' || needs.build-linux.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: DuneCity-Windows-Installer
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: DuneCity-macOS-DMG
          path: dist/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: DuneCity-Linux-Packages
          path: dist/linux

      - name: Update latest-dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^project(DuneCity VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          SHA="${GITHUB_SHA::8}"
          NOTES="Dev build v${VERSION} (${SHA})\n\nAuto-built from main @ $(date -u '+%Y-%m-%d %H:%M UTC')\n\n**Downloads** (attached below)"

          # Delete old dev release if it exists, then create fresh
          gh release delete latest-dev --yes 2>/dev/null || true
          git push origin :refs/tags/latest-dev 2>/dev/null || true

          # Collect whatever artifacts succeeded
          shopt -s nullglob
          FILES=(dist/*/*)
          if [ ${#FILES[@]} -gt 0 ]; then
            echo -e "$NOTES" | gh release create latest-dev "${FILES[@]}" \
              --title "Dev Build v${VERSION}" \
              --notes-file - \
              --prerelease
          fi

  # Auto-publish a GitHub Release on every v* tag push. Pulls down the
  # three platform artifacts from this run and attaches them. The
  # in-game VersionChecker hits the GitHub Releases /latest endpoint,
  # so creating a release here automatically flips every existing
  # install's "update available" flag the next time they launch.
  release:
    needs: [verify-version, test-linux, build-windows, build-linux, build-macos]
    # The website advertises all desktop platforms at this version. Publish only
    # after tests and every desktop package have actually succeeded.
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: DuneCity-Windows-Installer
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: DuneCity-macOS-DMG
          path: dist/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: DuneCity-Linux-Packages
          path: dist/linux

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="$(mktemp)"
          {
            echo "Dune City ${TAG}"
            echo
            echo "Auto-built from tag ${TAG}. See the [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}) for what's in this release."
            echo
            if [ -f "releases/desktop/${TAG#v}.md" ]; then
              sed '1,2d' "releases/desktop/${TAG#v}.md"
              echo
            fi
            echo "**Downloads** (attached below):"
            echo "- Windows: \`DuneCity-*.zip\`"
            echo "- Linux: \`.AppImage\` (recommended) / \`.deb\` / \`.rpm\` / \`.tar.gz\`"
            if compgen -G "dist/macos/*.dmg" > /dev/null; then
              echo "- macOS: \`DuneCity-*.dmg\`"
              echo
              echo "**Running on macOS:** the build is ad-hoc signed, so Gatekeeper blocks it on first launch (\"dunecity.app was blocked to protect your Mac\"). It's not damaged — approve it once: **System Settings → Privacy & Security → Open Anyway** (macOS 15/26), or right-click the app → **Open** on macOS 14 and earlier. Details: https://dunelegacy.com/dune-city.html#macos-fix"
            else
              echo "- macOS: no build was produced for this release. The last stable Mac build remains Dune City 1.0.359."
            fi
            echo
            echo "Upgrading from a previous Dune City install? Your built-in mod INI files are reseeded automatically on first launch."
          } > "$NOTES_FILE"

          # If a release for this tag already exists (e.g. it was hand-
          # made first), upload the artifacts onto it; otherwise create
          # a fresh release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*/* --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" dist/*/* \
              --title "Dune City ${TAG}" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Update dunelegacy.com website
        env:
          WEBSITE_DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          # Strip leading 'v' to get bare version number (e.g. v1.0.5 -> 1.0.5)
          VERSION="${TAG#v}"

          if [ -z "$WEBSITE_DEPLOY_KEY" ]; then
            echo "WEBSITE_DEPLOY_KEY is not configured" >&2
            exit 1
          fi

          # Authenticate to dunelegacy.com with an SSH deploy key (write-enabled).
          # Deploy keys don't expire — unlike the old WEBSITE_DEPLOY_TOKEN PAT,
          # which lapsed and silently broke this step.
          mkdir -p ~/.ssh
          printf '%s\n' "$WEBSITE_DEPLOY_KEY" > ~/.ssh/website_deploy
          chmod 600 ~/.ssh/website_deploy
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/website_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone git@github.com:VR48/dunelegacy.com.git website-repo
          cd website-repo

          # Guard: don't let a stale older run overwrite a newer version.
          CURRENT=$(sed -n 's/.*softwareVersion": "\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' website/index.html | head -1)
          if [ -n "$CURRENT" ] && [ "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "Website already at $CURRENT, skipping update to $VERSION (older)"
            exit 0
          fi

          # Replace version numbers and download URLs in both HTML files
          for FILE in website/index.html website/dune-city.html; do
            # Download URLs: v1.0.4/DuneCity-1.0.4-... -> vVERSION/DuneCity-VERSION-...
            sed -i "s|/v[0-9]\+\.[0-9]\+\.[0-9]\+/DuneCity-[0-9]\+\.[0-9]\+\.[0-9]\+-|/v${VERSION}/DuneCity-${VERSION}-|g" "$FILE"
            # Debian package names use lowercase and underscores.
            sed -i "s|/v[0-9]\+\.[0-9]\+\.[0-9]\+/dunecity_[0-9]\+\.[0-9]\+\.[0-9]\+_amd64\.deb|/v${VERSION}/dunecity_${VERSION}_amd64.deb|g" "$FILE"
            # Release tag links
            sed -i "s|releases/tag/v[0-9]\+\.[0-9]\+\.[0-9]\+|releases/tag/v${VERSION}|g" "$FILE"
            # Desktop release copy. Android is versioned independently, so its
            # labels must not be caught by these patterns.
            #
            # Since 1.0.599 all three desktop platforms ship from the same tag —
            # the Mac mini runner builds a DMG for every release — so the copy
            # says "Desktop: X.Y.Z" and "Windows, macOS and Linux X.Y.Z" rather
            # than carrying macOS as a separate, older version. The old
            # "no X macOS build exists" and "This is not version X" rewrites are
            # deliberately gone: left in place they would have restated a claim
            # that is now false, on the same page as a working DMG link.
            sed -i "s|>Dune City [0-9]\+\.[0-9]\+\.[0-9]\+<|>Dune City ${VERSION}<|g" "$FILE"
            sed -i "s|Desktop: [0-9]\+\.[0-9]\+\.[0-9]\+|Desktop: ${VERSION}|g" "$FILE"
            sed -i "s|Windows, macOS and Linux [0-9]\+\.[0-9]\+\.[0-9]\+|Windows, macOS and Linux ${VERSION}|g" "$FILE"
            # Desktop hero button text.
            sed -i "s|>Download [0-9]\+\.[0-9]\+\.[0-9]\+</a>|>Download ${VERSION}</a>|g" "$FILE"
            # Latest label: "Latest: X.X.X"
            sed -i "s|Latest: [0-9]\+\.[0-9]\+\.[0-9]\+|Latest: ${VERSION}|g" "$FILE"
            # Schema softwareVersion
            sed -i "s|softwareVersion\": \"[0-9]\+\.[0-9]\+\.[0-9]\+\"|softwareVersion\": \"${VERSION}\"|g" "$FILE"
            # "X.X.X is current"
            sed -i "s|[0-9]\+\.[0-9]\+\.[0-9]\+ is current|${VERSION} is current|g" "$FILE"
          done

          git config user.email "ci@dunelegacy.com"
          git config user.name "DuneCity CI"
          git add website/index.html website/dune-city.html
          git diff --cached --quiet || git commit -m "release: bump website to Dune City ${VERSION}"
          git push
