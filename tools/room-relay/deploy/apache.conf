# Existing certificate/vhosts serve this path; no extra hostname or open port.
ProxyRequests Off
<Location "/relay/">
    SSLRequireSSL
    ProxyAddHeaders Off
    # Replace untrusted client forwarding headers with the actual socket peer.
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto
    RequestHeader unset X-Forwarded-Port
    RequestHeader unset X-Real-IP
    LimitRequestBody 16384
</Location>
ProxyPass "/relay/" "http://127.0.0.1:8787/" upgrade=websocket connectiontimeout=5 timeout=60
ProxyPassReverse "/relay/" "http://127.0.0.1:8787/"
